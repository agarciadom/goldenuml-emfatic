plugins {
    id 'application'
}

application {
    mainClass = 'uk.ac.york.agentgen.AgentGenerator'
}

repositories {
    mavenCentral()
    maven {
        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
    }
}

dependencies {
    implementation("org.eclipse.epsilon:org.eclipse.epsilon.egl.engine:2.9.0-SNAPSHOT");
    implementation("org.eclipse.epsilon:org.eclipse.epsilon.emc.emf:2.9.0-SNAPSHOT");
    implementation("org.eclipse.epsilon:org.eclipse.epsilon.flexmi:2.9.0-SNAPSHOT");
    implementation("org.eclipse.emfatic:org.eclipse.emfatic.core:1.1.0");
}